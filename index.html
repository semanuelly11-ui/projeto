<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1 . 0">
    <title>Loja Responsiva</title>
    <style>
        body  {
            font-family: Arial;
            text-align: center;
        }
        .produtos {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .produto {
            width: 200px;
            padding: 20px;
            background-color: blueviolet;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1>Minha Loja</h1>
    <div class="produtos">
        <div class="produto"
           <h2>Saia</h2>
           <p>R$ 120,00</p>
           <button>Comprar</button>
        </div>
        <div class="produto">
            <h2>Sapatilha</h2>
            <p>R$ 200,00</p>
            <button>Comprar</button>
        </div>
        <div class="produto">
            <h2>Vestido</h2>
            <p>R$ 150,00</p>
            <button>Comprar</button>
        </div>
    </div>
</body>
</html>
